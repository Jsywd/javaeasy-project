    <meta name="description" content="ระบบเรียนรู้และสอนภาษา Java เบื้องต้นภาษาไทย พร้อมแบบทดสอบ แดชบอร์ด และระบบแอดมินจัดการบทเรียน" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
